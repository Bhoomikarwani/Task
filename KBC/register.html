<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KBC Audition Registration</title>
    <link rel="stylesheet" href="registerStyle.css">
</head>
<body>

    <navbar>
            <div class="nav">
                <div id="logo">
                    <img src="./assets/kbc.png" alt="image" class="logo">
                </div>
                <div id="links">
                    <ul class="pages">
                        <li><a href="./index.html">Home</a></li>
                        <li><a href="./about.html">About</a></li>
                        <li><a href="./q&a.html">Already Registered</a></li>
                        <li><a href="./register.html"><button id="registerBtn">REGISTER NOW</button></a></li>
                    </ul>
                </div>
            </div>
    </navbar>

    <div class="container">
        <h1 class="gradient-text">Audition Registration</h1>

        <div class="form-card">
            <form id="auditionForm">
                
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Enter your name" required>
                </div>

                <div class="form-group">
                    <label for="mobile">Mobile Number</label>
                    <input type="tel" id="mobile" name="mobile" placeholder="+91 XXXXX XXXXX" pattern="[0-9]{10}" required>
                </div>

                <div class="form-group">
                    <label for="state">State</label>
                    <select id="state" name="state" required>
                        <option value="" disabled selected>Select State</option>
                        <option value="Delhi">Delhi</option>
                        <option value="Maharashtra">Maharashtra</option>
                        <option value="Uttar Pradesh">Uttar Pradesh</option>
                        <option value="Karnataka">Karnataka</option>
                        <option value="Tamil Nadu">Tamil Nadu</option>
                        </select>
                </div>

                <div class="form-group">
                    <label for="reason">Why do you want to be on KBC?</label>
                    <textarea id="reason" name="reason" placeholder="Tell us your story..." rows="4" required></textarea>
                </div>

                <button type="submit" class="submit-btn">Submit Application</button>
            </form>
        </div>
    </div>

    <script src="registerScript.js"></script>

</body>
</html>
